<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Naruto: Tactical Ninja Battle</title>
    <link rel="stylesheet" href="../style.css">
    <style>
        body {
            background: #0d0d0d;
            color: #fff;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .battle-container {
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        
        .hud {
            display: flex;
            justify-content: space-between;
            background: #1e1e24;
            padding: 20px;
            border-radius: 12px;
            border: 2px solid #333;
        }
        .entity {
            text-align: center;
            width: 45%;
        }
        .entity h2 { margin: 0 0 10px 0; font-size: 1.5rem; }
        .entity .icon { font-size: 4rem; margin-bottom: 10px; }
        
        .bar-container {
            background: #222;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 5px;
            height: 20px;
            position: relative;
            border: 1px solid #444;
        }
        .bar-fill {
            height: 100%;
            transition: width 0.3s;
            width: 100%;
        }
        .hp-fill { background: linear-gradient(90deg, #d32f2f, #ff5252); }
        .chakra-fill { background: linear-gradient(90deg, #1565c0, #42a5f5); }
        .bar-text {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 0.8rem; font-weight: bold;
            text-shadow: 1px 1px 2px #000;
        }
        
        .boss-status {
            background: #111;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #333;
            margin-top: 10px;
            font-size: 0.9rem;
            color: #aaa;
        }
        .status-tag {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 4px;
            margin: 2px;
            font-weight: bold;
            font-size: 0.8rem;
        }
        .buff { background: #388e3c; color: #fff; }
        .debuff { background: #d32f2f; color: #fff; }

        .log-window {
            background: #1e1e24;
            border: 2px solid #333;
            border-radius: 12px;
            padding: 15px;
            height: 120px;
            overflow-y: auto;
            font-family: monospace;
            color: #b0bec5;
            font-size: 0.9rem;
        }
        
        .actions {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }
        .action-btn {
            background: #2a2a2a;
            border: 2px solid #444;
            color: #fff;
            padding: 15px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
            transition: 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }
        .action-btn:hover { background: #3a3a3a; border-color: #ff9800; }
        .action-btn span.cost { font-size: 0.8rem; color: #42a5f5; }
        
        .action-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            border-color: #333;
        }
        
        .game-over {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.9);
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 100;
        }
        .game-over h1 { font-size: 4rem; margin-bottom: 20px; }
    </style>
</head>
<body>
    <a href="../main.html" class="back-btn" style="position: absolute; top: 20px; left: 20px; padding: 10px 20px; background: #222; color: #fff; text-decoration: none; border-radius: 8px; border: 1px solid #444;">← В Лобби</a>

    <div class="battle-container" style="margin-top: 60px;">
        <div class="hud">
            <!-- Игрок -->
            <div class="entity">
                <h2>Наруто</h2>
                <div class="icon">🍥</div>
                <div class="bar-container">
                    <div class="bar-fill hp-fill" id="p-hp-bar"></div>
                    <div class="bar-text" id="p-hp-text">100 / 100</div>
                </div>
                <div class="bar-container">
                    <div class="bar-fill chakra-fill" id="p-chakra-bar"></div>
                    <div class="bar-text" id="p-chakra-text">50 / 50</div>
                </div>
            </div>

            <!-- Босс -->
            <div class="entity">
                <h2 id="boss-name">Пейн</h2>
                <div class="icon" id="boss-icon">🌀</div>
                <div class="bar-container">
                    <div class="bar-fill hp-fill" id="b-hp-bar" style="background: #9c27b0;"></div>
                    <div class="bar-text" id="b-hp-text">300 / 300</div>
                </div>
                <div class="boss-status" id="boss-status">
                    Статус: <span class="status-tag buff" id="boss-shield">Щит 100</span>
                </div>
            </div>
        </div>

        <div class="log-window" id="log">
            Битва началась! Пейн использует Щит. Пробей его, чтобы нанести урон.
        </div>

        <div class="actions">
            <button class="action-btn" id="btn-taijutsu">
                👊 Тайцзюцу (Удар)
                <span style="color:#aaa; font-size:0.8rem;">Урон: 10-15</span>
            </button>
            <button class="action-btn" id="btn-kunai">
                🗡️ Кунай
                <span class="cost">Стоимость: 10 Чакры</span>
            </button>
            <button class="action-btn" id="btn-fireball">
                🔥 Огненный Шар
                <span class="cost">Стоимость: 25 Чакры</span>
            </button>
            <button class="action-btn" id="btn-meditate">
                🧘 Медитация
                <span style="color:#4caf50; font-size:0.8rem;">+30 Чакры</span>
            </button>
        </div>
    </div>

    <div class="game-over" id="game-over">
        <h1 id="game-over-text">ВЫ ПОГИБЛИ</h1>
        <button class="action-btn" onclick="location.reload()" style="width: 200px;">Сыграть снова</button>
    </div>

    <script src="naruto.js"></script>
</body>
</html>
