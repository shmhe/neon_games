<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Games Hub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="hub-body">
    <div class="hub-container">
        <h1 class="hub-title">NEON GAMES</h1>
        
        <div class="hub-grid">
            <!-- КАРТОЧКА 1: Кликер -->
            <a href="index.html" class="game-card">
                <!-- Сюда вставь путь к картинке кликера вместо placeholder.jpg -->
                <div class="game-image-wrapper">
                    <img src="img/clicker.png" alt="Кликер" class="game-thumb">
                </div>
                <div class="game-info">
                    <div class="game-name">Кибер Кликер</div>
                    <div class="game-desc">Зарабатывай, улучшай, перерождайся</div>
                    <div class="game-stats">
                        <span>👍 98%</span>
                        <span>👥 15.4K</span>
                    </div>
                </div>
            </a>

            <!-- КАРТОЧКА 2: Демон Слеер -->
            <a href="demon_slayer/demon.html" class="game-card">
                <!-- Сюда вставь путь к картинке демон слеера вместо placeholder.jpg -->
                <div class="game-image-wrapper">
                    <img src="img/images.jpg" alt="Демон Слеер" class="game-thumb">
                </div>
                <div class="game-info">
                    <div class="game-name">[🔥] Demon Slayer</div>
                    <div class="game-desc">Игра по аниме истребители демонов</div>
                    <div class="game-stats">
                        <span>👍 95%</span>
                        <span>👥 8.2K</span>
                    </div>
                </div>
            </a>
            <!-- КАРТОЧКА 3: Наруто -->
            <a href="demon_slayer/naruto.html" class="game-card">
                <div class="game-image-wrapper">
                    <img src="https://via.placeholder.com/300x180/ff9800/ffffff?text=Naruto+Shinobi" alt="Наруто" class="game-thumb">
                </div>
                <div class="game-info">
                    <div class="game-name">[🍥] Naruto</div>
                    <div class="game-desc">Стань Хокаге и защити деревню</div>
                    <div class="game-stats">
                        <span>👍 99%</span>
                        <span>👥 22.4K</span>
                    </div>
                </div>
            </a>
            <!-- Если захочешь добавить третью игру, просто скопируй блок <a class="game-card">...</a> -->
        </div>
    </div>
</body>
</html>
